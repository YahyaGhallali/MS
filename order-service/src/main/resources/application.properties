# Server Port
server.port=8082

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Include custom exception message in HTTP error responses
server.error.include-message=always

# Product Service Base URL
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
